id: MyClusterId           # Optional. Must be unique. Auto-generated if omitted.
display_name: MyCluster   # Required. Must be unique.

public_ssh_key_path: ~/.ssh/id_ed25519.pub
private_ssh_key_path: ~/.ssh/id_ed25519

provider_id: aws          # Use provider_config_id instead to pin a specific config.
region: us-east-1
availability_zone: us-east-1c  # Required.

use_node_affinity: false           # Place all nodes in the same placement group (low-latency networking).
use_elastic_fabric_adapters: false # Enable EFA for high-throughput MPI workloads (instance must support it).
use_elastic_file_system: false     # Mount a shared NFS filesystem at /shared on all nodes.
                                   # Required if checkpoint data must survive spot termination across nodes.
# efs_performance_mode: general_purpose  # Optional. general_purpose (default) | max_io.
#                                        # max_io: higher aggregate IOPS for massively parallel workloads,
#                                        # but higher per-operation latency. Only useful with 100+ nodes.
# efs_throughput_mode: bursting          # Optional. bursting (default) | provisioned | elastic.
#                                        # bursting:    scales with stored data (~100 MB/s per TB stored).
#                                        # provisioned: fixed MB/s regardless of storage size (billed extra).
#                                        # elastic:     AWS auto-scales throughput on demand (pay-per-use).
# efs_provisioned_throughput_mbs: 256    # Required when efs_throughput_mode is 'provisioned'.

nodes:
  # Minimal node — all optional fields use defaults.
  - instance_type: c5.4xlarge
    allocation_mode: on-demand  # on-demand (default) | spot.
    image_id: ami-054a22e068102419a

  # Node with custom root volume.
  - instance_type: c5.4xlarge
    allocation_mode: spot
    image_id: ami-054a22e068102419a
    # root_volume_gb: 100       # Optional. Root EBS size in GB. Default: 100.
    # root_volume_type: gp3     # Optional. Boot-eligible types: gp2, gp3, io1, io2. Default: gp3.
    #                           # gp3 is provisioned at 500 MB/s throughput (above the 125 MB/s baseline).
    #                           # Use io1/io2 only if you need guaranteed high IOPS (e.g. databases on root).
    # root_volume_iops: 6000    # Optional. Provisioned IOPS. Limits: gp3 ≤ 16000, io1 ≤ 64000, io2 ≤ 256000.
    #                           # Not supported for gp2. gp3 baseline is 3000 (extra IOPS billed above that).
    #                           # io1/io2: all provisioned IOPS are billed.

  # Burstable instance (T-series only).
  - instance_type: t3.2xlarge
    allocation_mode: on-demand
    burstable_mode: Standard         # Standard | Unlimited. Only valid for burstable (t3, t4g, ...) types.
    image_id: ami-054a22e068102419a

# ─────────────────────────────────────────────────────────────────────────────
# on_interruption — optional recovery policy.
#
# If omitted, `hpcac cluster watch` re-spawns failed nodes with the SAME spec
# (1:1 replacement of the original slot). Define this block to customize per-slot
# recovery behavior: different instance types, spot→on-demand promotion, or
# scale-up (replace one failed node with multiple new ones).
#
# The `nodes` list is indexed by slot (0, 1, 2, ...) matching the top-level
# `nodes:` list above by insertion order. Each entry defines what to spawn if
# that slot's node fails.
# ─────────────────────────────────────────────────────────────────────────────
# on_interruption:
#   nodes:
#     # Slot 0 — same-size replacement, same instance type, promoted to on-demand.
#     # Use this when you want a spot instance to be replaced by an on-demand
#     # one on interruption (trades cost for reliability).
#     - preferred_instance_types: [c5.4xlarge]  # Ranked fallback list; first available in region wins.
#       allocation_mode: on-demand
#       image_id: ami-054a22e068102419a
#       # root_volume_gb, root_volume_type, root_volume_iops, burstable_mode
#       # all follow the same rules as top-level nodes[] and are optional.
#
#     # Slot 1 — scale-up: on failure, provision 4 replacements instead of 1.
#     # Net cluster size grows by (count - 1) after this slot fails.
#     # Useful for elastic HPC restarts on richer spot capacity.
#     - preferred_instance_types: [c5.4xlarge, c6i.4xlarge, c7i.4xlarge]
#       allocation_mode: spot
#       image_id: ami-054a22e068102419a
#       count: 4                                # Optional, default 1. Must be ≥ 1.
#
#     # Slot 2 — heterogeneous replacement: swap a CPU node for a GPU node
#     # on interruption. The restarting job must be able to handle mixed hardware
#     # (task-based runtimes like StarPU support this natively via device-aware
#     # codelets; MPI+OpenMP applications typically do not).
#     - preferred_instance_types: [g5.2xlarge, g6.2xlarge]
#       allocation_mode: on-demand
#       image_id: ami-054a22e068102419a         # Must be a compatible AMI for the target family.
#       root_volume_gb: 100
