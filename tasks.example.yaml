cluster_id: 1_c5-4xlarge
results_remote_dir: /home/ec2-user/results
results_local_dir: ~/Code/hpcac-toolkit/experiments/results

tasks:
  # Step 1: generate observed seismograms from the true velocity model.
  # Must run once before any FWI tasks. repeat: 1 since outputs are deterministic.
  - name: modeling-32shots
    mpi_slots_per_host: 1
    repeat: 1
    script: |
      set -e
      NP=$(wc -l < $HPCAC_HOSTFILE)
      OBSERVED_DIR=/shared/observed/32shots
      mkdir -p "$OBSERVED_DIR"

      STARPU_WORKERS_GETBIND=0 mpirun --bind-to none \
        --hostfile $HPCAC_HOSTFILE \
        -np $NP \
        starfwi-modeling \
          --shots 32 \
          --observed-dir "$OBSERVED_DIR" \
          --wavefield-dir /tmp \
          /shared/marmousi2/MODEL_P-WAVE_VELOCITY_1.25m.segy \
        2>&1 | tee /home/ec2-user/results/modeling-32shots.log

  - name: checkpointing-overhead-32shots
    mpi_slots_per_host: 1
    repeat: 5
    script: |
      set -e
      NP=$(wc -l < $HPCAC_HOSTFILE)
      OBSERVED_DIR=/shared/observed/32shots
      RESULT_DIR=/home/ec2-user/results/run_${HPCAC_RUN_INDEX}
      CHECKPOINT_DIR=/shared/checkpoints/32shots/run_${HPCAC_RUN_INDEX}
      mkdir -p "$RESULT_DIR" "$CHECKPOINT_DIR"

      STARPU_WORKERS_GETBIND=0 mpirun --bind-to none \
        --hostfile $HPCAC_HOSTFILE \
        -np $NP \
        starfwi-fwi \
          --shots 32 \
          --observed-dir "$OBSERVED_DIR" \
          --checkpoint-dir "$CHECKPOINT_DIR" \
          --checkpoint-interval 8 \
          --wavefield-dir /tmp \
          /shared/marmousi2/MODEL_P-WAVE_VELOCITY_1.25m.segy \
        2>&1 | tee "$RESULT_DIR/starfwi.log"

